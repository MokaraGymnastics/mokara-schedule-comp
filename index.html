<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mokara Gymnastics — Comp Schedule</title>
<style>
  :root {
    --navy: #1B365D;
    --navy-deep: #122441;
    --teal-bright: #A4DBE8;
    --teal-light: #D1EDF3;
    --purple-blue: #8094DD;
    --purple-light: #BECAEA;
    --cream: #F2F1E7;
    --yellow: #F8EBB1;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--navy-deep); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--cream); }
  #page { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--navy-deep); }
  #topBar { flex: 0 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: clamp(16px, 2.4vw, 40px); padding: clamp(14px, 2vh, 28px) clamp(20px, 2.4vw, 44px); background: var(--navy); box-shadow: 0 3px 14px rgba(0,0,0,0.35); border-bottom: 3px solid var(--yellow); }
  #brand { justify-self: start; font-weight: 800; letter-spacing: 2px; font-size: clamp(18px, 2.6vh, 28px); color: var(--cream); white-space: nowrap; }
  #modeBadge { font-size: 0.55em; font-weight: 800; letter-spacing: 1.5px; color: var(--purple-light); background: rgba(190,202,234,0.16); padding: 3px 9px; border-radius: 5px; margin-left: 10px; vertical-align: middle; }
  #headerCenter { justify-self: center; display: flex; align-items: baseline; gap: clamp(14px, 2vw, 30px); }
  #dayLabel { font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: clamp(28px, 4.4vh, 46px); color: var(--teal-bright); white-space: nowrap; }
  #clockTime { font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; font-size: clamp(28px, 4.4vh, 46px); color: var(--cream); white-space: nowrap; }
  #weekLabel { justify-self: end; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: clamp(18px, 2.6vh, 28px); color: var(--cream); white-space: nowrap; }
  #body { flex: 1 1 auto; display: flex; min-height: 0; }
  #gridArea { flex: 1 1 auto; min-width: 0; position: relative; display: flex; flex-direction: column; padding: clamp(12px, 1.8vh, 26px) clamp(16px, 2vw, 34px); overflow: hidden; }
  #ruler { display: flex; flex: 0 0 auto; height: clamp(32px, 4vh, 52px); margin-left: var(--label-width, 220px); position: relative; overflow: hidden; border-bottom: 2px solid rgba(255,255,255,0.18); margin-bottom: 10px; }
  #rulerInner { position: absolute; top: 0; left: 0; height: 100%; }
  .rulerTick { position: absolute; top: 0; bottom: 0; display: flex; align-items: flex-end; font-size: clamp(14px, 1.9vh, 22px); color: var(--teal-light); opacity: 0.8; border-left: 1px solid rgba(255,255,255,0.14); padding-left: 6px; font-weight: 600; white-space: nowrap; }
  .rulerTick.major { color: var(--cream); opacity: 1; font-weight: 800; border-left-color: rgba(255,255,255,0.35); }
  #rows { flex: 1 1 auto; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 20px); overflow-y: auto; min-height: 0; }
  .squadRow { flex: 1 1 0; display: flex; align-items: stretch; min-height: 0; }
  .squadLabel { flex: 0 0 var(--label-width, 220px); width: var(--label-width, 220px); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; font-weight: 800; font-size: clamp(20px, 2.8vh, 34px); padding-right: 14px; color: var(--purple-light); }
  .squadLabel .sqTag { font-size: 0.5em; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; margin-top: 3px; color: var(--purple-blue); }
  .squadTrack { position: relative; flex: 1 1 auto; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
  .trackInner { position: absolute; top: 0; left: 0; height: 100%; }
  .block { position: absolute; top: 6px; bottom: 6px; border-radius: 9px; box-sizing: border-box; padding: 14px 18px; overflow: hidden; font-size: clamp(28px, 4.6vh, 54px); line-height: 1.2; box-shadow: 0 3px 8px rgba(0,0,0,0.4); }
  .block .label { font-weight: 800; display: block; overflow-wrap: break-word; word-break: break-word; }
  .block .loc { display: block; opacity: 0.9; font-size: 0.78em; font-weight: 700; margin-top: 4px; overflow-wrap: break-word; word-break: break-word; }
  .block .time { display: block; opacity: 0.85; font-size: 0.62em; font-weight: 700; margin-top: 4px; white-space: normal; overflow-wrap: break-word; word-break: keep-all; }
  #nowLine { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--yellow); box-shadow: 0 0 12px rgba(248,235,177,0.9); z-index: 5; display: none; pointer-events: none; transition: left 1s linear; }
  #nowLine::before { content: "NOW"; position: absolute; top: -4px; left: 8px; font-size: clamp(13px, 1.6vh, 18px); font-weight: 800; letter-spacing: 1px; color: var(--yellow); white-space: nowrap; }
  #emptyMsg, #errorMsg { margin: auto; text-align: center; opacity: 0.85; font-size: clamp(18px, 2.6vh, 30px); padding: 20px; color: var(--teal-light); }
  #legend { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: clamp(12px, 1.6vw, 28px); align-items: center; padding: clamp(10px, 1.5vh, 20px) clamp(20px, 2.4vw, 44px); background: var(--navy-deep); font-size: clamp(14px, 1.7vh, 19px); border-top: 1px solid rgba(255,255,255,0.1); }
  .legendItem { display: flex; align-items: center; gap: 9px; opacity: 0.95; color: var(--teal-light); }
  .legendSwatch { display: inline-flex; align-items: center; justify-content: center; padding: 4px 11px; border-radius: 7px; font-weight: 800; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="page">
  <div id="topBar">
    <div id="brand">MOKARA GYMNASTICS<span id="modeBadge">COMP</span></div>
    <div id="headerCenter">
      <div id="dayLabel">-</div>
      <div id="clockTime">--:--</div>
    </div>
    <div id="weekLabel">-</div>
  </div>
  <div id="body">
    <div id="gridArea">
      <div id="ruler"></div>
      <div id="rows"></div>
      <div id="nowLine"></div>
    </div>
  </div>
  <div id="legend"></div>
</div>
<script>
  // ---- Configuration ----
  var SHEET_ID = "1Mc3GH64jMGS2weZvh-4RcRgvtP7jakxCSPulJwK2uso";
  var API_KEY = "AIzaSyA2-7pL3Dy9-DTXbtVp2SXRQgeOOrtN86s";
  var TIMEZONE = "Asia/Singapore";
  var REFRESH_MS = 120000;
  var WEEK1_ANCHOR = "2026-09-07"; // Monday — Week 1 of the 5-week pattern
  var ROTATION_LENGTH = 5;
  var WEEK_TAB_MAP = { 1: "Week 1 and 4", 2: "Week 2", 3: "Week 3 and 5", 4: "Week 1 and 4", 5: "Week 3 and 5" };
  // Squads NOT in this list are treated as Rec (named/individual squads). This screen only
  // ever shows squads in this list. Update here if the coaches add new Comp squads.
  var COMP_SQUADS = ["16s 20s 23s", "12s", "12s 16s", "Pre-Devo", "Pre-Devo = Devo 2", "23/20s", "16s"];
  var WEEKEND_CUTOFF_MIN = 13 * 60 + 30; // 1:30pm — splits Saturday/Sunday into AM/PM sections
  var DAY_LABEL_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday AM|Saturday PM|Sunday AM|Sunday PM)$/;
  // One fixed, distinct color per activity type — this is the single source of truth for
  // BOTH the legend chips and the actual schedule blocks, so they always match.
  var CODE_COLORS = {
    WU: "#90CBDF", // Warm Up
    VT: "#7179D6", // Vault
    UB: "#F1D47E", // Uneven Bars
    BB: "#DD7D5F", // Balance Beam
    FX: "#BF69BF", // Floor Exercise
    TR: "#5CC1A0", // Trampoline
    KG: "#646D87"  // Kindy Gym area
  };
  var BREAK_COLOR = "#000000";

  // ---- Rolling-timeline configuration (this screen scrolls continuously as time passes) ----
  var ROLL_VISIBLE_MINUTES = 90; // how many minutes of schedule are visible on screen at once
  var ROLL_NOW_FRACTION = 0.14;  // where "now" sits across the visible width (0 = left edge)
  var ROLL_UPDATE_MS = 1000;     // how often we nudge the scroll position; CSS tweens smoothly between ticks

  function getNow() {
    var params = new URLSearchParams(window.location.search);
    var override = params.get("debug_now");
    return override ? new Date(override) : new Date();
  }

  function getPartsInTZ(date) {
    var fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false, weekday: "long"
    });
    var parts = {};
    fmt.formatToParts(date).forEach(function (p) { parts[p.type] = p.value; });
    return parts;
  }

  // Same as getPartsInTZ but with second-level precision, used only for the smooth scroll math.
  function nowMinutesPrecise(date) {
    var fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });
    var parts = {};
    fmt.formatToParts(date).forEach(function (p) { parts[p.type] = p.value; });
    var h = parseInt(parts.hour, 10), m = parseInt(parts.minute, 10), s = parseInt(parts.second, 10);
    return h * 60 + m + s / 60;
  }

  function dateOnlyUTC(y, m, d) { return Date.UTC(y, m - 1, d); }

  function categorize(squadName) {
    return COMP_SQUADS.indexOf(squadName.trim()) !== -1 ? "Comp" : "Rec";
  }

  function colorToHex(c) {
    if (!c) return null;
    function ch(v) { return Math.round((v || 0) * 255).toString(16).padStart(2, "0"); }
    return "#" + ch(c.red) + ch(c.green) + ch(c.blue);
  }

  function luminance(hex) {
    var h = hex.replace("#", "");
    var r = parseInt(h.substr(0, 2), 16) / 255;
    var g = parseInt(h.substr(2, 2), 16) / 255;
    var b = parseInt(h.substr(4, 2), 16) / 255;
    function lin(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }

  function textColorFor(hex) {
    return luminance(hex) > 0.5 ? "#16233b" : "#ffffff";
  }

  // Text inside the schedule blocks is black by default; only a near-black background
  // (like the "Break" cells) gets white text instead.
  function blockTextColor(hex) {
    return luminance(hex) < 0.12 ? "#ffffff" : "#000000";
  }

  function computeWeekAndSection(now) {
    var parts = getPartsInTZ(now);
    var y = parseInt(parts.year, 10), m = parseInt(parts.month, 10), d = parseInt(parts.day, 10);
    var startBits = WEEK1_ANCHOR.split("-").map(Number);
    var startUTC = dateOnlyUTC(startBits[0], startBits[1], startBits[2]);
    var todayUTC = dateOnlyUTC(y, m, d);
    var daysSinceStart = Math.round((todayUTC - startUTC) / 86400000);
    var weekIndex0 = Math.floor(daysSinceStart / 7);
    var cyclePos = ((weekIndex0 % ROTATION_LENGTH) + ROTATION_LENGTH) % ROTATION_LENGTH;
    var weekNumber = cyclePos + 1;
    var tabName = WEEK_TAB_MAP[weekNumber];
    var weekday = parts.weekday; // e.g. "Monday"
    var minutesOfDay = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
    var sectionLabel = weekday;
    if (weekday === "Saturday" || weekday === "Sunday") {
      sectionLabel = weekday + (minutesOfDay < WEEKEND_CUTOFF_MIN ? " AM" : " PM");
    }
    return { weekNumber: weekNumber, tabName: tabName, sectionLabel: sectionLabel, weekday: weekday };
  }

  function sheetsApiUrl(ranges, fields) {
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "?includeGridData=true&key=" + API_KEY + "&fields=" + encodeURIComponent(fields);
    ranges.forEach(function (r) { url += "&ranges=" + encodeURIComponent(r); });
    return url;
  }

  function fetchGrids(tabNames) {
    var fields = "sheets(properties.title,merges,data.rowData.values(formattedValue,effectiveFormat.backgroundColor))";
    var url = sheetsApiUrl(tabNames, fields);
    return fetch(url).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("Sheets API error " + r.status + ": " + t.slice(0, 200)); });
      return r.json();
    }).then(function (json) {
      var out = {};
      (json.sheets || []).forEach(function (s) {
        out[s.properties.title] = { rowData: (s.data && s.data[0] && s.data[0].rowData) || [], merges: s.merges || [] };
      });
      return out;
    });
  }

  function cellText(cell) {
    return ((cell && cell.formattedValue) || "").trim();
  }

  function findMerge(merges, rowIdx, colIdx) {
    for (var i = 0; i < merges.length; i++) {
      var m = merges[i];
      if (rowIdx >= m.startRowIndex && rowIdx < m.endRowIndex && colIdx >= m.startColumnIndex && colIdx < m.endColumnIndex) return m;
    }
    return null;
  }

  function parseTimeLabel(str) {
    var m = str.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function buildRuler(rowData, rulerRowIdx, startCol, endColExclusive, isAMSection) {
    var ruler = {};
    var offset = 0, last = -1, initialized = false;
    var row = rowData[rulerRowIdx];
    for (var c = startCol; c < endColExclusive; c++) {
      var t = cellText(row.values[c]);
      var base = parseTimeLabel(t);
      if (base === null) continue;
      if (!initialized) {
        // Sheet times are bare "4:00" style with no AM/PM. Weekday practice sessions
        // run afternoon/evening, so hours 1-11 default to PM unless this is an
        // explicitly-labeled "... AM" weekend section.
        var hour = Math.floor(base / 60);
        if (!isAMSection && hour >= 1 && hour < 12) offset = 12 * 60;
        initialized = true;
      }
      var val = base + offset;
      if (val < last) { offset += 12 * 60; val = base + offset; }
      last = val;
      ruler[c] = val;
    }
    return ruler;
  }

  function parseActivityText(raw) {
    var clean = raw.replace(/\s+/g, " ").trim();
    // "Label (Location) 4:15 - 5:00" style
    var m = clean.match(/^(.*?)\s*\(([^)]+)\)\s*[\d:apmAPM\-–\s]*$/);
    if (m && m[1]) return { label: m[1].trim(), location: m[2].trim() };
    // "CODE - Location" style
    m = clean.match(/^([A-Za-z0-9]{1,6})\s*-\s*(.+)$/);
    if (m) return { label: m[1].trim(), location: m[2].trim() };
    // fallback: strip a trailing time range if present
    var stripped = clean.replace(/[\d:apmAPM]{3,}\s*-\s*[\d:apmAPM]{3,}\s*$/, "").trim();
    return { label: stripped || clean, location: "" };
  }

  // Comp squads' cells often carry their own explicit time range as free text, e.g.
  // "Warm Up Condish (Team Rod + Team Tumble Strip) 4:00 - 5:00". Those merged cells don't
  // always line up neatly with the 15-minute ruler grid (coaches resize them by hand), so the
  // column-position math in sessionsForSquadRow can be several minutes off. When a cell's text
  // ends with an explicit "H:MM - H:MM" range, that's the authoritative time — this extracts it.
  function parseEmbeddedRange(raw, isAMSection) {
    var clean = raw.replace(/\s+/g, " ").trim();
    var m = clean.match(/(\d{1,2}:\d{2})\s*(?:am|pm|AM|PM)?\s*[-–]\s*(\d{1,2}:\d{2})\s*(?:am|pm|AM|PM)?\s*$/);
    if (!m) return null;
    var startBase = parseTimeLabel(m[1]);
    var endBase = parseTimeLabel(m[2]);
    if (startBase === null || endBase === null) return null;
    function toAbsolute(base, prevAbsolute) {
      var hour = Math.floor(base / 60);
      var offset = (!isAMSection && hour >= 1 && hour < 12) ? 12 * 60 : 0;
      var val = base + offset;
      if (prevAbsolute !== null && val < prevAbsolute) val += 12 * 60;
      return val;
    }
    var startAbs = toAbsolute(startBase, null);
    var endAbs = toAbsolute(endBase, startAbs);
    if (endAbs <= startAbs) return null;
    return { start: startAbs, end: endAbs };
  }

  // Resolves a block's display color from its activity label: an exact code match (WU, VT,
  // UB, ...) wins, then a keyword match against the fuller Comp-squad descriptions, then
  // "Break" is forced black, and anything else falls back to whatever color the coach set
  // on that cell in the sheet.
  function resolveBlockColor(label, rawBg) {
    var code = (label || "").trim().toUpperCase();
    if (CODE_COLORS[code]) return CODE_COLORS[code];
    var lc = (label || "").toLowerCase();
    if (lc.indexOf("break") !== -1) return BREAK_COLOR;
    if (lc.indexOf("warm up") !== -1) return CODE_COLORS.WU;
    if (lc.indexOf("vault") !== -1) return CODE_COLORS.VT;
    if (lc.indexOf("bars") !== -1) return CODE_COLORS.UB;
    if (lc.indexOf("beam") !== -1) return CODE_COLORS.BB;
    if (lc.indexOf("floor") !== -1) return CODE_COLORS.FX;
    if (lc.indexOf("tramp") !== -1) return CODE_COLORS.TR;
    if (lc.indexOf("presch") !== -1 || lc.indexOf("kindy") !== -1) return CODE_COLORS.KG;
    return rawBg;
  }

  function extractDaySection(rowData, merges, sectionLabel) {
    var dayHeaders = [];
    rowData.forEach(function (r, i) {
      var v = cellText(r.values && r.values[0]);
      if (DAY_LABEL_RE.test(v)) dayHeaders.push({ index: i, label: v });
    });
    var target = null, nextIndex = rowData.length;
    for (var i = 0; i < dayHeaders.length; i++) {
      if (dayHeaders[i].label === sectionLabel) {
        target = dayHeaders[i];
        if (i + 1 < dayHeaders.length) nextIndex = dayHeaders[i + 1].index;
        break;
      }
    }
    if (!target) return null;
    // find ruler row: first row after header with a time-like value in a column >= 2
    var rulerRowIdx = -1;
    for (var r = target.index + 1; r < Math.min(nextIndex, target.index + 6); r++) {
      var row = rowData[r];
      if (!row || !row.values) continue;
      for (var c = 2; c < Math.min(row.values.length, 6); c++) {
        if (parseTimeLabel(cellText(row.values[c])) !== null) { rulerRowIdx = r; break; }
      }
      if (rulerRowIdx !== -1) break;
    }
    if (rulerRowIdx === -1) return null;
    var maxCols = 0;
    for (var rr = rulerRowIdx; rr < nextIndex; rr++) {
      if (rowData[rr] && rowData[rr].values) maxCols = Math.max(maxCols, rowData[rr].values.length);
    }
    var isAMSection = sectionLabel.indexOf("AM") !== -1;
    var ruler = buildRuler(rowData, rulerRowIdx, 2, maxCols, isAMSection);
    var rulerCols = Object.keys(ruler).map(Number).sort(function (a, b) { return a - b; });
    return { squadStart: rulerRowIdx + 1, squadEnd: nextIndex, ruler: ruler, rulerCols: rulerCols, maxCols: maxCols, isAMSection: isAMSection };
  }

  function sessionsForSquadRow(rowData, merges, rowIdx, ruler, rulerCols, maxCols, isAMSection) {
    var sessions = [];
    var row = rowData[rowIdx];
    var col = rulerCols.length ? rulerCols[0] : 2;
    var lastCol = rulerCols.length ? rulerCols[rulerCols.length - 1] : maxCols - 1;
    while (col <= lastCol) {
      var merge = findMerge(merges, rowIdx, col);
      var srcRow = merge ? merge.startRowIndex : rowIdx;
      var srcCol = merge ? merge.startColumnIndex : col;
      var endCol = merge ? merge.endColumnIndex : col + 1;
      var srcCell = rowData[srcRow] && rowData[srcRow].values ? rowData[srcRow].values[srcCol] : null;
      var text = cellText(srcCell);
      if (text) {
        // Prefer the cell's own explicit time range (Comp squads write one in) over the
        // column/merge position, since merges don't always land cleanly on the 15-min grid.
        var embedded = parseEmbeddedRange(text, isAMSection);
        var startMin = embedded ? embedded.start : (ruler[col] !== undefined ? ruler[col] : null);
        var endMin = embedded ? embedded.end : (ruler[endCol] !== undefined ? ruler[endCol] : (startMin !== null ? startMin + 15 * (endCol - col) : null));
        if (startMin !== null && endMin !== null && endMin > startMin) {
          var parsed = parseActivityText(text);
          var bg = (srcCell.effectiveFormat && srcCell.effectiveFormat.backgroundColor) ? colorToHex(srcCell.effectiveFormat.backgroundColor) : "#5a6b85";
          sessions.push({ label: parsed.label, location: parsed.location, start: startMin, end: endMin, bg: bg });
        }
      }
      col = endCol;
    }
    return sessions;
  }

  function formatMinutes(mins) {
    var h = Math.floor(mins / 60) % 24;
    var m = mins % 60;
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }

  function tickClock() {
    var now = new Date();
    var timeFmt = new Intl.DateTimeFormat("en-US", { timeZone: TIMEZONE, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
    document.getElementById("clockTime").textContent = timeFmt.format(now);
  }

  function showError(msg) {
    document.getElementById("rows").innerHTML = '<div id="errorMsg">' + msg + "</div>";
    document.getElementById("nowLine").style.display = "none";
  }

  var legendCache = null;
  function fetchLegend() {
    if (legendCache) return Promise.resolve(legendCache);
    return fetchGrids(["Legend"]).then(function (grids) {
      var rowData = grids["Legend"] ? grids["Legend"].rowData : [];
      var items = [];
      rowData.forEach(function (r) {
        var code = cellText(r.values && r.values[1]);
        var name = cellText(r.values && r.values[2]);
        if (code && name) items.push({ code: code, name: name });
      });
      legendCache = items;
      return items;
    }).catch(function () { return []; });
  }

  function renderLegend(items) {
    var el = document.getElementById("legend");
    el.innerHTML = "";
    items.forEach(function (it) {
      var div = document.createElement("div");
      div.className = "legendItem";
      // Looked up by the exact code, same as the schedule blocks, so the legend always
      // matches what's shown above it.
      var bg = CODE_COLORS[(it.code || "").trim().toUpperCase()] || "#5a6b85";
      var fg = textColorFor(bg);
      div.innerHTML = '<span class="legendSwatch" style="background:' + bg + ";color:" + fg + '">' + it.code + "</span><span>" + it.name + "</span>";
      el.appendChild(div);
    });
  }

  // ---- Rolling timeline state & helpers ----
  // Unlike the combined-squads screen (which lays out the whole day as a static percentage
  // width), this Comp-only screen keeps a constant pixels-per-minute scale and continuously
  // scrolls the timeline left as real time passes, so "now" stays roughly fixed on screen
  // while classes glide past like a ticker.
  var rollState = null;

  function computeScrollX(state, nowMin) {
    var scrollX = (nowMin - state.baseT) * state.pxPerMin - state.viewportWidth * ROLL_NOW_FRACTION;
    var maxScroll = Math.max(state.totalWidth - state.viewportWidth, 0);
    if (scrollX < 0) scrollX = 0;
    if (scrollX > maxScroll) scrollX = maxScroll;
    return scrollX;
  }

  function applyRollTransform(instant) {
    if (!rollState) return;
    var nowLineEl = document.getElementById("nowLine");
    var nowMin = nowMinutesPrecise(getNow());
    // The "NOW" marker only makes sense while the actual time is inside today's scheduled
    // window — before the first class or after the last one, hide it instead of letting it
    // sit on a class that isn't actually happening right now.
    var inRange = nowMin >= rollState.baseT && nowMin <= rollState.maxT;
    nowLineEl.style.display = inRange ? "block" : "none";
    var scrollX = computeScrollX(rollState, nowMin);
    var transform = "translateX(-" + scrollX.toFixed(1) + "px)";
    var els = [rollState.rulerInner].concat(rollState.trackInners);
    if (instant) {
      els.forEach(function (el) { el.style.transition = "none"; el.style.transform = transform; });
      nowLineEl.style.transition = "none";
      void rollState.rulerInner.offsetHeight; // force reflow so the "none" transition takes effect
      requestAnimationFrame(function () {
        els.forEach(function (el) { el.style.transition = "transform " + (ROLL_UPDATE_MS / 1000) + "s linear"; });
        nowLineEl.style.transition = "left " + (ROLL_UPDATE_MS / 1000) + "s linear";
      });
    } else {
      els.forEach(function (el) { el.style.transform = transform; });
    }
    // The marker's on-screen position is recomputed from the real clock every tick, rather
    // than held at a fixed resting spot, so it tracks "now" exactly even during the first/
    // last ~12 minutes of the day when the timeline is pinned at its start/end and the
    // scroll above can't move to compensate.
    if (inRange) {
      var nowPxInTimeline = (nowMin - rollState.baseT) * rollState.pxPerMin - scrollX;
      if (nowPxInTimeline < 0) nowPxInTimeline = 0;
      if (nowPxInTimeline > rollState.viewportWidth) nowPxInTimeline = rollState.viewportWidth;
      nowLineEl.style.left = (rollState.trackOffsetX + nowPxInTimeline) + "px";
    }
  }

  function renderSchedule(squads) {
    var rowsEl = document.getElementById("rows");
    var rulerEl = document.getElementById("ruler");
    var nowLineEl = document.getElementById("nowLine");
    rowsEl.innerHTML = "";
    rulerEl.innerHTML = "";
    rollState = null;

    if (!squads.length) {
      rowsEl.innerHTML = '<div id="emptyMsg">No Comp classes scheduled right now.</div>';
      nowLineEl.style.display = "none";
      return;
    }

    var allStarts = [], allEnds = [];
    squads.forEach(function (sq) {
      sq.sessions.forEach(function (s) { allStarts.push(s.start); allEnds.push(s.end); });
    });
    if (!allStarts.length) {
      rowsEl.innerHTML = '<div id="emptyMsg">No Comp classes scheduled right now.</div>';
      nowLineEl.style.display = "none";
      return;
    }
    var minT = Math.min.apply(null, allStarts);
    var maxT = Math.max.apply(null, allEnds);
    var span = Math.max(maxT - minT, 1);

    // Build each squad row (the "viewport") first so we can measure its real pixel width.
    var rowItems = [];
    squads.forEach(function (sq) {
      var rowEl = document.createElement("div");
      rowEl.className = "squadRow";
      var label = document.createElement("div");
      label.className = "squadLabel";
      label.innerHTML = '<span class="sqName">' + sq.name + '</span><span class="sqTag">' + sq.category + '</span>';
      var track = document.createElement("div");
      track.className = "squadTrack";
      var inner = document.createElement("div");
      inner.className = "trackInner";
      track.appendChild(inner);
      rowEl.appendChild(label);
      rowEl.appendChild(track);
      rowsEl.appendChild(rowEl);
      rowItems.push({ sq: sq, track: track, inner: inner });
    });

    var viewportWidth = rowItems[0].track.clientWidth || 800;
    var pxPerMin = viewportWidth / ROLL_VISIBLE_MINUTES;
    var totalWidth = span * pxPerMin;

    // Ruler, built in the same pixel coordinate space as the blocks.
    var rulerInner = document.createElement("div");
    rulerInner.id = "rulerInner";
    rulerInner.style.width = totalWidth + "px";
    for (var t = Math.ceil(minT / 15) * 15; t <= maxT; t += 15) {
      var leftPx = (t - minT) * pxPerMin;
      var tick = document.createElement("div");
      var isHour = (t % 60) === 0;
      tick.className = "rulerTick" + (isHour ? " major" : "");
      tick.style.left = leftPx + "px";
      tick.textContent = formatMinutes(t).replace(" ", "");
      rulerInner.appendChild(tick);
    }
    rulerEl.appendChild(rulerInner);

    rowItems.forEach(function (item) {
      item.inner.style.width = totalWidth + "px";
      item.sq.sessions.forEach(function (s) {
        var leftPx = (s.start - minT) * pxPerMin;
        var widthPx = Math.max((s.end - s.start) * pxPerMin, 12);
        var block = document.createElement("div");
        block.className = "block";
        block.style.left = leftPx + "px";
        block.style.width = widthPx + "px";
        var resolvedBg = resolveBlockColor(s.label, s.bg);
        block.style.background = resolvedBg;
        var fg = blockTextColor(resolvedBg);
        block.style.color = fg;
        var html = '<span class="label">' + s.label + "</span>";
        if (s.location) html += '<span class="loc">' + s.location + "</span>";
        html += '<span class="time">' + formatMinutes(s.start) + " - " + formatMinutes(s.end) + "</span>";
        block.innerHTML = html;
        item.inner.appendChild(block);
      });
    });

    // "now" marker position (left) and visibility are both recomputed every tick in
    // applyRollTransform, so they always reflect the real clock — trackOffsetX just accounts
    // for the squad-label column so the marker lines up with the scrolling track beside it.
    var gridRect = document.getElementById("gridArea").getBoundingClientRect();
    var trackRect = rowItems[0].track.getBoundingClientRect();

    rollState = {
      baseT: minT,
      maxT: maxT,
      pxPerMin: pxPerMin,
      totalWidth: totalWidth,
      viewportWidth: viewportWidth,
      trackOffsetX: trackRect.left - gridRect.left,
      rulerInner: rulerInner,
      trackInners: rowItems.map(function (x) { return x.inner; })
    };

    applyRollTransform(true);
  }

  function loadAndRender() {
    var now = getNow();
    var info = computeWeekAndSection(now);
    document.getElementById("dayLabel").textContent = info.sectionLabel;
    document.getElementById("weekLabel").textContent = "Week " + info.weekNumber;

    Promise.all([fetchGrids([info.tabName]), fetchLegend()]).then(function (results) {
      var grids = results[0];
      var legendItems = results[1];
      renderLegend(legendItems);
      var sheet = grids[info.tabName];
      if (!sheet) throw new Error("Could not read tab '" + info.tabName + "'.");
      var section = extractDaySection(sheet.rowData, sheet.merges, info.sectionLabel);
      if (!section) { renderSchedule([]); return; }
      var squads = [];
      for (var r = section.squadStart; r < section.squadEnd; r++) {
        var row = sheet.rowData[r];
        if (!row || !row.values) continue;
        var name = cellText(row.values[0]);
        if (!name) continue;
        var cat = categorize(name);
        if (cat !== "Comp") continue; // this screen only ever shows Comp squads
        var sessions = sessionsForSquadRow(sheet.rowData, sheet.merges, r, section.ruler, section.rulerCols, section.maxCols, section.isAMSection);
        if (sessions.length) squads.push({ name: name, category: cat, sessions: sessions });
      }
      renderSchedule(squads);
    }).catch(function (err) {
      console.error(err);
      showError("Schedule data unavailable right now — it'll retry automatically.<br>" + (err && err.message ? err.message : ""));
    });
  }

  (function scheduleMidnightReload() {
    var now = new Date();
    var next = new Date(now);
    next.setHours(24, 1, 0, 0);
    setTimeout(function () { window.location.reload(); }, next.getTime() - now.getTime());
  })();

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(loadAndRender, 300);
  });

  tickClock();
  setInterval(tickClock, 1000);
  setInterval(function () { applyRollTransform(false); }, ROLL_UPDATE_MS);
  loadAndRender();
  setInterval(loadAndRender, REFRESH_MS);
</script>
</body>
</html>
